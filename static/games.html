    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Declare variables at the top of the function scope
            let games = [];
            const container = document.getElementById("gamesContainer");
            const iframeContainer = document.getElementById("iframeContainer");
            const gameObject = document.getElementById("gameObject");
            const loadingIndicator = document.getElementById("loadingIndicator");
            const fullScreenButton = document.getElementById("fullScreenButton");
            const closeButton = document.getElementById("closeButton");
            
            // Function to display games
            function displayGames(filteredGames) {
                container.innerHTML = "";
                filteredGames.forEach(function (game) {
                    const button = document.createElement("button");
                    button.className = "button";

                    const img = document.createElement("img");
                    img.src = game.image;
                    img.alt = game.name;
                    button.appendChild(img);

                    const title = document.createElement("div");
                    title.className = "game-title";
                    title.textContent = game.name;
                    button.appendChild(title);

                    button.onclick = function () {
                        document.querySelectorAll(".button").forEach(element => (element.style.display = "none"));
                        iframeContainer.style.display = "flex";
                        loadingIndicator.style.display = "flex";
                        gameObject.data = game.url;
                        
                        // Hide loading indicator when game loads
                        gameObject.onload = function() {
                            loadingIndicator.style.display = "none";
                        };
                    };
                    container.appendChild(button);
                });
                
                // Apply animation delays to buttons after they're created
                applyButtonAnimations();
            }

            // Fetch games from JSON file
            fetch('assets/json/games.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    games = data;
                    displayGames(games);
                    document.getElementById("gameCount").textContent = games.length;
                })
                .catch(error => {
                    console.error('Error loading games:', error);
                    // Fallback message if games can't be loaded
                    container.innerHTML = '<div class="error-message">Unable to load games. Please try refreshing the page.</div>';
                });

            // Setup event listeners
            fullScreenButton.addEventListener("click", function () {
                if (gameObject.requestFullscreen) {
                    gameObject.requestFullscreen();
                } else if (gameObject.mozRequestFullScreen) {
                    gameObject.mozRequestFullScreen();
                } else if (gameObject.webkitRequestFullscreen) {
                    gameObject.webkitRequestFullscreen();
                } else if (gameObject.msRequestFullscreen) {
                    gameObject.msRequestFullscreen();
                }
            });

            closeButton.addEventListener("click", function () {
                iframeContainer.style.display = "none";
                gameObject.data = "";
                document.querySelectorAll(".button").forEach(element => (element.style.display = "inline-block"));
            });

            document.getElementById("searchInput").addEventListener("input", function (event) {
                const searchTerm = event.target.value.toLowerCase();
                // Only filter games if they've been loaded
                if (games && games.length > 0) {
                    const filteredGames = games.filter(function (game) {
                        return game.name.toLowerCase().includes(searchTerm);
                    });
                    displayGames(filteredGames);
                }
            });
        });

// Check authentication status and update UI
function checkAuthStatus() {
    const authToken = localStorage.getItem('authToken');
    const userData = JSON.parse(localStorage.getItem('userData') || '{}');
    const authLink = document.getElementById('authLink');
    const accountStatus = document.getElementById('account-status');
    
    if (authToken && userData) {
        // User is logged in
        authLink.textContent = 'Account';
        authLink.href = 'account.html';
        
        // Show account status
        if (accountStatus) {
            accountStatus.style.display = 'block';
            document.getElementById('username').textContent = userData.username || 'User';
            document.getElementById('coin-amount').textContent = userData.coins || '0';
        }
    } else {
        // User is not logged in
        authLink.textContent = 'Login';
        authLink.href = 'login.html';
        
        // Hide account status
        if (accountStatus) {
            accountStatus.style.display = 'none';
        }
    }
}
        
// Initialize coin tracker when a game is opened
function openGame(url, name) {
    // Start tracking coins if user is logged in
    const authToken = localStorage.getItem('authToken');
    if (authToken && window.coinTracker) {
        // Use the game name as the ID
        window.coinTracker.init(name);
        
        // Setup progress bar update
        setupCoinProgressBar();
    }
            
    // Open the game
    iframeContainer.style.display = "flex";
    gameObject.src = url;
    gameObject.onload = function() {
        loadingIndicator.style.display = "none";
    };
    loadingIndicator.style.display = "block";
}

// Setup coin progress bar
function setupCoinProgressBar() {
    // Clear any existing interval
    if (window.progressInterval) {
        clearInterval(window.progressInterval);
    }
    
    // Reset progress
    const progressBar = document.getElementById('coin-progress');
    const progressText = document.getElementById('progress-text');
    if (!progressBar || !progressText) return;
    
    progressBar.style.width = '0%';
    progressText.textContent = '0/60 seconds';
    
    let seconds = 0;
    const coinInterval = 60; // Earn coins every 60 seconds
    
    window.progressInterval = setInterval(() => {
        seconds++;
        const percentage = (seconds % coinInterval) / coinInterval * 100;
        
        progressBar.style.width = percentage + '%';
        progressText.textContent = `${seconds % coinInterval}/${coinInterval} seconds`;
        
        // When reaching the interval, reset progress bar
        if (seconds % coinInterval === 0) {
            // Update coin display if available
            const coinAmount = document.getElementById('coin-amount');
            if (coinAmount) {
                const currentCoins = parseInt(coinAmount.textContent) || 0;
                coinAmount.textContent = currentCoins + 1;
            }
            
            // Flash the progress bar
            progressBar.style.transition = 'none';
            progressBar.style.width = '100%';
            progressBar.style.opacity = '0.8';
            
            setTimeout(() => {
                progressBar.style.transition = 'width 0.3s ease, opacity 0.3s ease';
                progressBar.style.width = '0%';
                progressBar.style.opacity = '1';
            }, 300);
        }
    }, 1000);
}

// Run auth check when page loads
document.addEventListener('DOMContentLoaded', function() {

// Initialize hamburger menu functionality
function initHamburgerMenu() {
    const hamburgerBtn = document.querySelector('.hamburger-btn');
    const dropdownContent = document.querySelector('.dropdown-content');
    
    // Toggle dropdown menu when clicking the hamburger button
    hamburgerBtn.addEventListener('click', function(event) {
        event.stopPropagation(); // Prevent event from bubbling up
        dropdownContent.classList.toggle('active');
    });
    
    // Keep dropdown open when clicking inside it
    dropdownContent.addEventListener('click', function(event) {
        event.stopPropagation(); // Prevent event from bubbling up
    });
    
    // Close dropdown when clicking outside
    document.addEventListener('click', function() {
        dropdownContent.classList.remove('active');
    });
}

// Apply saved settings
const applySettings = () => {
    const settings = JSON.parse(localStorage.getItem('siteSettings') || '{}');
            
    // Set default title if no settings exist
    document.title = settings.pageTitle || 'Google';
            
    // Set default favicon if no settings exist
    const faviconPath = settings.cloakPreset ? {
        'google': 'assets/favicon/google.ico',
        'drive': 'assets/favicon/drive.ico',
        'classroom': 'assets/favicon/classroom.ico',
        'canvas': 'assets/favicon/canvas.ico'
    }[settings.cloakPreset] : 'assets/favicon/google.ico';

    const links = document.querySelectorAll('link[rel="icon"]');
    links.forEach(link => link.remove());
    const newLink = document.createElement('link');
    newLink.rel = 'icon';
    newLink.href = faviconPath;
    document.head.appendChild(newLink);
};
        
// Apply settings when page loads
document.addEventListener('DOMContentLoaded', applySettings);

<script>
// Function to apply animation delays to buttons
function applyButtonAnimations() {
  const buttons = document.querySelectorAll("#gamesContainer .button");
  const delayIncrement = 0.05; // seconds

  buttons.forEach((button, index) => {
    const delay = (index + 1) * delayIncrement;
    button.style.animationDelay = `${delay}s`;
  });
}

// The original event listener is no longer needed as we call applyButtonAnimations() after creating buttons
</script>
