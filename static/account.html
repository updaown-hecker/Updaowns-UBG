    <script>
        // Check authentication status
        function checkAuth() {
            const token = localStorage.getItem('authToken');
            const userData = JSON.parse(localStorage.getItem('userData') || '{}');
            
            if (token && userData.username) {
                loadAccountPage(userData);
            } else {
                loadLoginPrompt();
            }
        }
        
        // Load login prompt for users not logged in
        function loadLoginPrompt() {
            const accountContent = document.getElementById('account-content');
            accountContent.innerHTML = `
                <div class="login-prompt">
                    <h2>Login Required</h2>
                    <p>You need to be logged in to access your account.</p>
                    <p>Login to earn coins, unlock themes and particles, and customize your gaming experience!</p>
                    <a href="/login.html" class="login-button">Login</a>
                    <p>Don't have an account? <a href="/register.html">Register</a> and get 2 free themes and particles of your choice!</p>
                </div>
            `;
        }
        
        // Load account page for logged in users
        function loadAccountPage(userData) {
            // Fetch latest user data from server
            fetchUserProfile()
                .then(data => {
                    if (data.success) {
                        renderAccountPage(data.user);
                    } else {
                        // If token is invalid, log out
                        logout();
                        loadLoginPrompt();
                    }
                })
                .catch(error => {
                    console.error('Error fetching profile:', error);
                    // Use cached user data if server request fails
                    renderAccountPage(userData);
                });
        }
        
        // Fetch user profile from server
        async function fetchUserProfile() {
            try {
                const token = localStorage.getItem('authToken');
                if (!token) {
                    throw new Error('No authentication token found');
                }
                
                // First try to get from server
                try {
                    const response = await fetch('/api/auth/profile', {
                        method: 'GET',
                        headers: {
                            'x-auth-token': token
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        // Update localStorage with latest user data
                        if (data.success && data.user) {
                            localStorage.setItem('userData', JSON.stringify(data.user));
                        }
                        return data;
                    } else {
                        throw new Error('Failed to fetch profile from server');
                    }
                } catch (serverError) {
                    console.warn('Server fetch failed, using cached data:', serverError);
                    // Fall back to cached data
                    const userData = JSON.parse(localStorage.getItem('userData') || '{}');
                    return { success: true, user: userData };
                }
            } catch (error) {
                console.error('Profile fetch error:', error);
                return { success: false, message: error.message };
            }
        }
        
        // Render account page with user data
        function renderAccountPage(user) {
            const accountContent = document.getElementById('account-content');
            
            // Update localStorage with latest user data
            localStorage.setItem('userData', JSON.stringify(user));
            
            // Calculate coins per minute if the method exists
            let coinsPerMinute = 1;
            if (user.powerups && user.powerups.coinRate) {
                coinsPerMinute = 1 + (user.powerups.coinRate * 4);
            }
            
            // Calculate coin multiplier
            let coinMultiplier = 1;
            if (user.powerups && user.powerups.coinBoost) {
                coinMultiplier = 1 + (user.powerups.coinBoost * 0.2);
            }
            
            accountContent.innerHTML = `
                <div class="account-container">
                    <div class="account-header">
                        <div class="account-info">
                            <h1>Welcome, ${user.username}</h1>
                            <p>${user.email}</p>
                        </div>
                        <div class="account-actions">
                            <div class="coin-display">
                                <div class="coin-icon">$</div>
                                <span class="coin-amount">${user.coins}</span>
                                ${coinMultiplier > 1 ? `<span class="multiplier-badge">x${coinMultiplier.toFixed(1)}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    
                    <div class="account-grid">
                        <div class="account-section">
                            <h2>Account Stats</h2>
                            <ul class="stats-list">
                                <li>
                                    <span class="stats-label">Account Created</span>
                                    <span class="stats-value">${new Date(user.createdAt).toLocaleDateString()}</span>
                                </li>
                                <li>
                                    <span class="stats-label">Last Login</span>
                                    <span class="stats-value">${new Date(user.lastLogin).toLocaleDateString()}</span>
                                </li>
                                <li>
                                    <span class="stats-label">Total Coins</span>
                                    <span class="stats-value">${user.coins}</span>
                                </li>
                                <li>
                                    <span class="stats-label">Unlocked Themes</span>
                                    <span class="stats-value">${user.unlockedThemes ? user.unlockedThemes.length : 0}</span>
                                </li>
                                <li>
                                    <span class="stats-label">Unlocked Particles</span>
                                    <span class="stats-value">${user.unlockedParticles ? user.unlockedParticles.length : 0}</span>
                                </li>
                            </ul>
                        </div>
                        
                        <div class="account-section">
                            <h2>Active Items</h2>
                            <div class="active-items">
                                <div class="active-item">
                                    <span class="active-item-label">Current Theme:</span>
                                    <span class="active-item-value">${user.selectedTheme || 'Default'}</span>
                                </div>
                                <div class="active-item">
                                    <span class="active-item-label">Active Particles:</span>
                                    <span class="active-item-value">${user.selectedParticles && user.selectedParticles.length > 0 ? user.selectedParticles.join(', ') : 'None'}</span>
                                </div>
                                <div class="active-item">
                                    <span class="active-item-label">Coin Multiplier:</span>
                                    <span class="active-item-value">${coinMultiplier.toFixed(1)}x</span>
                                </div>
                                <div class="active-item">
                                    <span class="active-item-label">Coins Per Minute:</span>
                                    <span class="active-item-value">${coinsPerMinute}</span>
                                </div>
                            </div>
                            <div class="shop-link-container">
                                <a href="shop.html" class="shop-link">Visit Shop to Purchase Items</a>
                            </div>
                        </div>
                    </div>
                    
                    <div id="active-powerups-section" class="account-section">
                        <h2>Active Powerups</h2>
                        <div id="active-powerups-container">
                            <p>Loading active powerups...</p>
                        </div>
                    </div>
                    
                    <div class="account-section">
                        <h2>Change Password</h2>
                        <form id="change-password-form">
                            <div class="form-group">
                                <label for="current-password">Current Password</label>
                                <input type="password" id="current-password" required>
                            </div>
                            <div class="form-group">
                                <label for="new-password">New Password</label>
                                <input type="password" id="new-password" required minlength="6">
                            </div>
                            <div class="form-group">
                                <label for="confirm-password">Confirm New Password</label>
                                <input type="password" id="confirm-password" required minlength="6">
                            </div>
                            <button type="submit" class="password-submit">Update Password</button>
                        </form>
                    </div>
                    
                    <div class="account-section">
                        <h2>Account Actions</h2>
                        <button class="logout-button" id="logout-button">Logout</button>
                    </div>
                </div>
            `;
            
            // Add logout event listener
            document.getElementById('logout-button').addEventListener('click', logout);
            
            // Add password change form event listener
            document.getElementById('change-password-form').addEventListener('submit', function(e) {
                e.preventDefault();
                changePassword();
            });
            
            // Load active powerups
            loadActivePowerups(user);
        }
        
        // Load active powerups
        function loadActivePowerups(user) {
            const activePowerupsContainer = document.getElementById('active-powerups-container');
            
            // Check if user has activePowerups
            if (!user.activePowerups || Object.keys(user.activePowerups).length === 0) {
                activePowerupsContainer.innerHTML = `
                    <p class="no-powerups-message">You don't have any active powerups.</p>
                `;
                return;
            }
            
            let powerupHtml = '';
            const now = new Date();
            
            // Map of powerup IDs to their display names and descriptions
            const powerupDetails = {
                'doubleCoins': {
                    name: 'Double Coins',
                    description: 'Doubles all coins earned',
                    icon: '💰'
                },
                'luckyStreak': {
                    name: 'Lucky Streak',
                    description: '25% chance to earn triple coins',
                    icon: '🍀'
                }
                // Add more powerups as needed
            };
            
            // Process each active powerup
            for (const [powerupId, powerupData] of Object.entries(user.activePowerups)) {
                const expiresAt = new Date(powerupData.expiresAt);
                const timeLeft = expiresAt - now;
                
                if (timeLeft <= 0) continue; // Skip expired powerups
                
                // Calculate percentage of time remaining
                const activatedAt = new Date(powerupData.activatedAt);
                const totalDuration = expiresAt - activatedAt;
                const percentLeft = (timeLeft / totalDuration) * 100;
                
                // Format time remaining
                const hours = Math.floor(timeLeft / (1000 * 60 * 60));
                const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
                
                let timeString = '';
                if (hours > 0) {
                    if (hours >= 24) {
                        const days = Math.floor(hours / 24);
                        timeString += `${days}d `;
                        if (hours % 24 > 0) {
                            timeString += `${hours % 24}h `;
                        }
                    } else {
                        timeString += `${hours}h `;
                    }
                }
                timeString += `${minutes}m ${seconds.toString().padStart(2, '0')}s`;
                
                // Get powerup details or use defaults
                const details = powerupDetails[powerupId] || {
                    name: powerupId,
                    description: 'Active powerup',
                    icon: '✨'
                };
                
                powerupHtml += `
                    <div class="active-powerup-card">
                        <div class="active-powerup-header">
                            <div class="active-powerup-icon">${details.icon}</div>
                            <div class="active-powerup-info">
                                <h3 class="active-powerup-name">${details.name}</h3>
                                <p class="active-powerup-description">${details.description}</p>
                            </div>
                        </div>
                        <div class="active-powerup-timer">
                            <div class="timer-bar">
                                <div class="timer-progress" style="width: ${percentLeft}%"></div>
                            </div>
                            <div class="timer-text">
                                <span>Time Remaining: ${timeString}</span>
                                <span class="stack-count">Stack Count: ${powerupData.stackCount || 1}</span>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            if (powerupHtml === '') {
                activePowerupsContainer.innerHTML = `
                    <p class="no-powerups-message">You don't have any active powerups.</p>
                `;
            } else {
                activePowerupsContainer.innerHTML = powerupHtml;
            }
            
            // Update timers every second
            setTimeout(() => loadActivePowerups(user), 1000);
        }
        
        // Change password function
        async function changePassword() {
            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            // Validate passwords
            if (!currentPassword || !newPassword || !confirmPassword) {
                showNotification('All password fields are required', 'error');
                return;
            }
            
            if (newPassword.length < 6) {
                showNotification('New password must be at least 6 characters', 'error');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showNotification('New passwords do not match', 'error');
                return;
            }
            
            try {
                const token = localStorage.getItem('authToken');
                const response = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-auth-token': token
                    },
                    body: JSON.stringify({
                        currentPassword,
                        newPassword
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showNotification('Password updated successfully', 'success');
                    
                    // Clear password fields
                    document.getElementById('current-password').value = '';
                    document.getElementById('new-password').value = '';
                    document.getElementById('confirm-password').value = '';
                } else {
                    showNotification(data.message || 'Failed to update password', 'error');
                }
            } catch (error) {
                console.error('Password change error:', error);
                showNotification('An error occurred while changing password', 'error');
            }
        }
        
        // Logout function
        function logout() {
            // Clear authentication data
            localStorage.removeItem('authToken');
            localStorage.removeItem('userData');
            
            // Reset theme to default
            localStorage.setItem('theme', 'default');
            if (window.verifyAndApplyTheme) {
                window.verifyAndApplyTheme();
            }
            
            // Disable all particles except rain
            const particleTypes = ['snow', 'confetti', 'bubbles', 'fireflies', 'stars', 'matrix', 'geometric'];
            particleTypes.forEach(type => {
                localStorage.setItem(`${type}Enabled`, 'false');
                if (window.particlesLoader && window.particlesLoader.unload) {
                    window.particlesLoader.unload(type);
                }
            });
            
            // Show notification
            showNotification('Logged out successfully', 'success');
            
            // Redirect to login page
            setTimeout(() => {
                window.location.href = '/login.html';
            }, 1500);
        }
        
        // Show notification
        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = 'notification ' + type;
            notification.classList.add('show');
            
            // Hide after 3 seconds
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
        
        // Run on page load
        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
