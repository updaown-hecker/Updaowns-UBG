  var container = document.getElementById("gamesContainer");
  var iframeContainer = document.getElementById("iframeContainer");
  var gameFrame = document.getElementById("gameFrame");
  var gameObject = document.getElementById("gameObject");
  var fullScreenButton = document.getElementById("fullScreenButton");
  var closeButton = document.getElementById("closeButton");

  function displayGames(filteredGames) {
    container.innerHTML = "";
    filteredGames.forEach(function (game) {
      var button = document.createElement("button");
      button.className = "button";

      var img = document.createElement("img");
      img.src = game.image;
      img.alt = game.name;
      button.appendChild(img);

      var title = document.createElement("div");
      title.className = "game-title";
      title.textContent = game.name;
      button.appendChild(title);

      button.onclick = function () {
        document
          .querySelectorAll(".button")
          .forEach(element => (element.style.display = "none"));
        iframeContainer.style.display = "flex"; // Show the iframe container
        gameFrame.src = ""; // Reset the iframe src
        gameObject.data = ""; // Reset the object data
        if (game.url.startsWith("http://") || game.url.startsWith("https://")) {
          gameObject.data = game.url; // Set the object data for external links
          gameFrame.style.display = "none";
          gameObject.style.display = "block";
        } else {
          gameFrame.src = game.url; // Set the iframe src for internal files
          gameFrame.style.display = "block";
          gameObject.style.display = "none";
        }
      };
      container.appendChild(button);
    });
  }

  displayGames(games);

  document.getElementById("gameCount").textContent = games.length;

  fullScreenButton.addEventListener("click", function () {
    if (gameFrame.style.display === "block") {
      if (gameFrame.requestFullscreen) {
        gameFrame.requestFullscreen();
      } else if (gameFrame.mozRequestFullScreen) {
        // Firefox
        gameFrame.mozRequestFullScreen();
      } else if (gameFrame.webkitRequestFullscreen) {
        // Chrome, Safari, Opera
        gameFrame.webkitRequestFullscreen();
      } else if (gameFrame.msRequestFullscreen) {
        // IE/Edge
        gameFrame.msRequestFullscreen();
      }
    } else if (gameObject.style.display === "block") {
      if (gameObject.requestFullscreen) {
        gameObject.requestFullscreen();
      } else if (gameObject.mozRequestFullScreen) {
        // Firefox
        gameObject.mozRequestFullScreen();
      } else if (gameObject.webkitRequestFullscreen) {
        // Chrome, Safari, Opera
        gameObject.webkitRequestFullscreen();
      } else if (gameObject.msRequestFullscreen) {
        // IE/Edge
        gameObject.msRequestFullscreen();
      }
    }
  });

    iframeContainer.style.display = "none"; // Hide the iframe container

      .querySelectorAll(".button")
      .forEach(element => (element.style.display = "inline-block")); // Show the game buttons
    gameFrame.src = ""; // Clear the iframe src
    gameObject.data = ""; // Clear the object data
  });

  document.getElementById("searchInput").addEventListener("input", function (event) {

    var filteredGames = games.filter(function (game) {
      return game.name.toLowerCase().includes(searchTerm);
    });
    displayGames(filteredGames);
  });

const toggleRainSwitch = document.getElementById("toggle-rain");
let rainOverlay = null;

const isRainEnabled = localStorage.getItem("rainEnabled") === "true";
toggleRainSwitch.checked = isRainEnabled;

if (isRainEnabled) {
  rainOverlay = document.createElement("iframe");
  rainOverlay.id = "rain-overlay";
  rainOverlay.src = "assets/particles/rain.html";
  document.body.appendChild(rainOverlay);
}

toggleRainSwitch.addEventListener("change", event => {
  const isChecked = event.target.checked;

  if (isChecked) {
    if (!rainOverlay) {
      rainOverlay = document.createElement("iframe");
      rainOverlay.id = "rain-overlay";
      rainOverlay.src = "assets/particles/rain.html";
      document.body.appendChild(rainOverlay);
    }
  } else {
    if (rainOverlay) {
      rainOverlay.remove();
      rainOverlay = null;
    }
  }

  localStorage.setItem("rainEnabled", isChecked);
});
// Apply saved settings
        const applySettings = () => {
            const settings = JSON.parse(localStorage.getItem('siteSettings') || '{}');
            
            // Set default title if no settings exist
            document.title = settings.pageTitle || 'Google';
            
            // Set default favicon if no settings exist
            const faviconPath = settings.cloakPreset ? {
                'google': 'assets/favicon/google.ico',
                'drive': 'assets/favicon/drive.ico',
                'classroom': 'assets/favicon/classroom.ico',
                'canvas': 'assets/favicon/canvas.ico'
            }[settings.cloakPreset] : 'assets/favicon/google.ico';

            const links = document.querySelectorAll('link[rel="icon"]');
            links.forEach(link => link.remove());
            const newLink = document.createElement('link');
            newLink.rel = 'icon';
            newLink.href = faviconPath;
            document.head.appendChild(newLink);
        };
        
        // Apply settings when page loads
        document.addEventListener('DOMContentLoaded', applySettings);
